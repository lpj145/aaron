[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lpj145/aaron"
authors = ["Marcos Dantas <marcos.adantas@hotmail.com>"]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "time", "sync", "signal", "rt-multi-thread", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "json"] }
tokio-util = { version = "0.7.19" }
snafu = "0.9.2"