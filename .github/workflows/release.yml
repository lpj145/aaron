name: Release to crates.io

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (simulate without publishing to crates.io)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-crates-io
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify workspace build and tests
        run: |
          cargo check --workspace --all-targets
          cargo test --workspace

      - name: Publish packages to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/publish.sh
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          ./scripts/publish.sh --skip-tests $EXTRA_FLAGS
