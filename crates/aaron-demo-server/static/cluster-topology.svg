<svg viewBox="0 0 1380 520" class="w-full h-auto overflow-visible" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes flowLine {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: flowLine 1.4s linear infinite;
      }
      .svg-node {
        transition: transform 0.25s ease, filter 0.25s ease;
        cursor: pointer;
      }
      .svg-node:hover {
        filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6));
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
    </style>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-brand" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Node Chassis Gradients -->
    <radialGradient id="node-chassis-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141f36" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#0b1120" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#060911" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="core-user-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <radialGradient id="core-cp-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>

    <radialGradient id="core-worker-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- Conduit Stream Gradients -->
    <linearGradient id="grad-user-direct" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="grad-cp-rpc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="grad-swim-gossip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="100%" height="100%" fill="#070a10" rx="16" />

  <!-- Top Category Labels -->
  <g opacity="0.9">
    <text x="140" y="28" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">USER / CLIENT</text>
    <text x="510" y="28" text-anchor="middle" fill="#818cf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">CONTROL-PLANE</text>
    <text x="820" y="28" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">CLUSTER INTERCONNECT</text>
    <text x="1150" y="28" text-anchor="middle" fill="#34d399" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">AUTONOMOUS WORKER NODES</text>
  </g>

  <!-- ======================================================== -->
  <!-- CLUSTER CONDUITS & ROUTING FABRIC (Smooth Curved Paths)  -->
  <!-- ======================================================== -->

  <!-- 1. User -> Control-Plane (Route Discovery) -->
  <path id="path-user-cp" d="M 215 260 L 420 260" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5 3" class="flow-line" opacity="0.9" />

  <!-- 2. User -> Worker 01 (Upper Direct Shard I/O) -->
  <path id="path-user-w1" d="M 185 200 C 270 50, 750 42, 1060 145" fill="none" stroke="url(#grad-user-direct)" stroke-width="2.4" opacity="0.88" />

  <!-- 3. User -> Worker 02 (Lower Direct Shard I/O) -->
  <path id="path-user-w2" d="M 185 320 C 270 470, 750 478, 1060 375" fill="none" stroke="url(#grad-user-direct)" stroke-width="2.4" opacity="0.88" />

  <!-- 4. Control-Plane -> Worker 01 (Shard RPC) -->
  <path id="path-cp-w1" d="M 598 240 C 760 240, 890 145, 1060 145" fill="none" stroke="url(#grad-cp-rpc)" stroke-width="2.2" opacity="0.88" />

  <!-- 5. Control-Plane -> Worker 02 (Shard RPC) -->
  <path id="path-cp-w2" d="M 598 280 C 760 280, 890 375, 1060 375" fill="none" stroke="url(#grad-cp-rpc)" stroke-width="2.2" opacity="0.88" />

  <!-- 6. SWIM Gossip Mesh Conduits -->
  <path id="path-swim-w1" d="M 598 255 C 760 255, 890 162, 1060 162" fill="none" stroke="url(#grad-swim-gossip)" stroke-width="2" stroke-dasharray="6 4" class="flow-line" opacity="0.85" />
  <path id="path-swim-w2" d="M 598 265 C 760 265, 890 358, 1060 358" fill="none" stroke="url(#grad-swim-gossip)" stroke-width="2" stroke-dasharray="6 4" class="flow-line" opacity="0.85" />

  <!-- 7. Inter-Worker P2P Peer Shard Sync Bridge -->
  <path id="path-worker-sync" d="M 1240 145 C 1300 145, 1300 375, 1240 375" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" class="flow-line" opacity="0.8" />

  <!-- ======================================================== -->
  <!-- ANIMATED TRAFFIC PARTICLES                               -->
  <!-- ======================================================== -->
  <!-- User to CP Particle -->
  <circle r="4" fill="#38bdf8" filter="url(#glow-cyan)">
    <animateMotion dur="1.2s" repeatCount="indefinite">
      <mpath href="#path-user-cp"/>
    </animateMotion>
  </circle>

  <!-- User to Worker 1 Direct I/O Particle -->
  <circle r="4.5" fill="#34d399" filter="url(#glow-emerald)">
    <animateMotion dur="2.4s" repeatCount="indefinite">
      <mpath href="#path-user-w1"/>
    </animateMotion>
  </circle>

  <!-- User to Worker 2 Direct I/O Particle -->
  <circle r="4.5" fill="#34d399" filter="url(#glow-emerald)">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite">
      <mpath href="#path-user-w2"/>
    </animateMotion>
  </circle>

  <!-- CP to Worker 1 RPC Particle -->
  <circle r="3.8" fill="#818cf8" filter="url(#glow-brand)">
    <animateMotion dur="1.8s" repeatCount="indefinite">
      <mpath href="#path-cp-w1"/>
    </animateMotion>
  </circle>

  <!-- CP to Worker 2 RPC Particle -->
  <circle r="3.8" fill="#818cf8" filter="url(#glow-brand)">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite">
      <mpath href="#path-cp-w2"/>
    </animateMotion>
  </circle>

  <!-- ======================================================== -->
  <!-- CONDUIT FLOATING BADGES                                  -->
  <!-- ======================================================== -->
  <!-- User to CP Badge -->
  <g transform="translate(315, 260)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow-cyan)" />
    <circle cx="-52" cy="0" r="3" fill="#38bdf8" />
    <text x="-42" y="4" fill="#38bdf8" class="font-mono" font-size="8.5" font-weight="700">1. Query Route &amp; Meta</text>
  </g>

  <!-- User to Worker 1 Direct I/O Badge -->
  <g transform="translate(620, 48)">
    <rect x="-90" y="-12" width="180" height="24" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.2" filter="url(#glow-emerald)" />
    <circle cx="-77" cy="0" r="3" fill="#34d399" />
    <text x="-67" y="4" fill="#34d399" class="font-mono" font-size="8.5" font-weight="700">2. Direct Shard I/O • Read/Write</text>
  </g>

  <!-- User to Worker 2 Direct I/O Badge -->
  <g transform="translate(620, 472)">
    <rect x="-90" y="-12" width="180" height="24" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.2" filter="url(#glow-emerald)" />
    <circle cx="-77" cy="0" r="3" fill="#34d399" />
    <text x="-67" y="4" fill="#34d399" class="font-mono" font-size="8.5" font-weight="700">2. Direct Shard I/O • Read/Write</text>
  </g>

  <!-- Shard RPC Command Badge -->
  <g transform="translate(835, 175)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#090d16" stroke="#818cf8" stroke-width="1.2" filter="url(#glow-brand)" />
    <circle cx="-72" cy="0" r="3" fill="#818cf8" />
    <text x="-62" y="4" fill="#c7d2fe" class="font-mono" font-size="8.5" font-weight="700">Control-Plane RPC • :18946</text>
  </g>

  <!-- SWIM Gossip Badge -->
  <g transform="translate(835, 345)">
    <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#090d16" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="-67" cy="0" r="3" fill="#06b6d4" />
    <text x="-57" y="4" fill="#67e8f9" class="font-mono" font-size="8.5" font-weight="700">SWIM Gossip Mesh • :7946</text>
  </g>

  <!-- Inter-Worker Sync Pill -->
  <g transform="translate(1305, 260)">
    <rect x="-30" y="-10" width="60" height="20" rx="10" fill="#090d16" stroke="#10b981" stroke-width="1.2" />
    <text x="0" y="3.5" text-anchor="middle" fill="#34d399" class="font-mono" font-size="8" font-weight="700">P2P SYNC</text>
  </g>

  <!-- ======================================================== -->
  <!-- NÓ 0: USER / CLIENT (APENAS O NÓ)                        -->
  <!-- ======================================================== -->
  <g class="svg-node" transform="translate(140, 260)">
    <!-- Outer Orbital Pulse Ring -->
    <circle r="72" fill="url(#node-chassis-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
    <circle r="64" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" stroke-dasharray="5 4" />

    <!-- Central Glowing Core -->
    <circle r="42" fill="url(#core-user-grad)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- User Silhouette Icon -->
    <circle cx="0" cy="-10" r="9" fill="#ffffff" />
    <path d="M -14 14 C -14 4, 14 4, 14 14" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Core Title -->
    <text x="0" y="24" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="800" letter-spacing="0.5">USER</text>

    <!-- Header Badge -->
    <g transform="translate(0, -90)">
      <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="-42" cy="0" r="3.5" fill="#38bdf8" filter="url(#glow-cyan)" />
      <text x="-32" y="3.5" fill="#ffffff" class="font-mono" font-size="9" font-weight="700">Client App</text>
    </g>

    <!-- Subtitle below -->
    <text x="0" y="90" text-anchor="middle" fill="#94a3b8" font-size="9.5">aaron-client SDK</text>
    <text x="0" y="103" text-anchor="middle" fill="#64748b" font-size="8.5">Route Cache • Fast QUIC</text>

    <!-- Ports -->
    <circle cx="72" cy="0" r="4" fill="#38bdf8" stroke="#070a10" stroke-width="1.5" />
    <circle cx="45" cy="-60" r="4" fill="#34d399" stroke="#070a10" stroke-width="1.5" />
    <circle cx="45" cy="60" r="4" fill="#34d399" stroke="#070a10" stroke-width="1.5" />
  </g>

  <!-- ======================================================== -->
  <!-- NÓ 1: CONTROL-PLANE COORDINATOR (APENAS O NÓ)             -->
  <!-- ======================================================== -->
  <g class="svg-node" transform="translate(510, 260)">
    <!-- Outer Orbital Ring -->
    <circle r="88" fill="url(#node-chassis-grad)" stroke="#818cf8" stroke-width="2.2" filter="url(#glow-brand)" />
    <circle r="78" fill="none" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.4" stroke-dasharray="6 5" />

    <!-- Central Glowing Core -->
    <circle r="52" fill="url(#core-cp-grad)" stroke="#818cf8" stroke-width="2.2" />
    
    <!-- Crown / Coordinator Icon -->
    <polygon points="0,-22 9,-10 18,-18 12,2 -12,2 -18,-18 -9,-10" fill="#ffffff" />
    
    <!-- Core Title -->
    <text x="0" y="16" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="0.5">CONTROL-PLANE</text>
    <text x="0" y="28" text-anchor="middle" fill="#a5b4fc" class="font-mono" font-size="8.5" font-weight="700">LEADER ACTIVE</text>

    <!-- Header Badge -->
    <g transform="translate(0, -106)">
      <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#090d16" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="-67" cy="0" r="3.5" fill="#818cf8" filter="url(#glow-brand)" />
      <text x="-57" y="3.5" fill="#c7d2fe" class="font-mono" font-size="9" font-weight="700">Cluster Coordinator</text>
    </g>

    <!-- Subtitle below -->
    <text x="0" y="106" text-anchor="middle" fill="#94a3b8" font-size="9.5">State Registry • Shard Placement</text>
    <text x="0" y="119" text-anchor="middle" fill="#64748b" class="font-mono" font-size="8.5">RPC :18946 • SWIM :7946</text>

    <!-- Ports -->
    <circle cx="-88" cy="0" r="4.5" fill="#38bdf8" stroke="#070a10" stroke-width="1.5" />
    <circle cx="88" cy="-20" r="4" fill="#818cf8" stroke="#070a10" stroke-width="1.5" />
    <circle cx="88" cy="20" r="4" fill="#818cf8" stroke="#070a10" stroke-width="1.5" />
    <circle cx="88" cy="-5" r="4" fill="#06b6d4" stroke="#070a10" stroke-width="1.5" />
    <circle cx="88" cy="5" r="4" fill="#06b6d4" stroke="#070a10" stroke-width="1.5" />
  </g>

  <!-- ======================================================== -->
  <!-- NÓ 2: WORKER 01 (APENAS O NÓ)                             -->
  <!-- ======================================================== -->
  <g class="svg-node" transform="translate(1150, 145)">
    <!-- Outer Orbital Ring -->
    <circle r="80" fill="url(#node-chassis-grad)" stroke="#10b981" stroke-width="2" filter="url(#glow-emerald)" />
    <circle r="70" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" stroke-dasharray="5 4" />

    <!-- Central Glowing Core -->
    <circle r="46" fill="url(#core-worker-grad)" stroke="#10b981" stroke-width="2" />
    
    <!-- Shard Database Icon -->
    <rect x="-12" y="-18" width="24" height="8" rx="2" fill="#ffffff" />
    <rect x="-12" y="-8" width="24" height="8" rx="2" fill="#a7f3d0" />
    <rect x="-12" y="2" width="24" height="8" rx="2" fill="#ffffff" />
    
    <!-- Core Title -->
    <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="800">WORKER 01</text>
    <text x="0" y="32" text-anchor="middle" fill="#a7f3d0" class="font-mono" font-size="8.5" font-weight="700">[0000..4095]</text>

    <!-- Header Badge -->
    <g transform="translate(0, -98)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.2" />
      <circle cx="-57" cy="0" r="3.5" fill="#10b981" filter="url(#glow-emerald)" />
      <text x="-47" y="3.5" fill="#6ee7b7" class="font-mono" font-size="9" font-weight="700">Worker Shard</text>
    </g>

    <!-- Subtitle below -->
    <text x="0" y="98" text-anchor="middle" fill="#94a3b8" font-size="9.5">LSM Storage Host</text>
    <text x="0" y="111" text-anchor="middle" fill="#64748b" class="font-mono" font-size="8.5">QUIC IO • SWIM :7947</text>

    <!-- Ports -->
    <circle cx="-80" cy="0" r="4.5" fill="#34d399" stroke="#070a10" stroke-width="1.5" />
    <circle cx="-80" cy="17" r="4" fill="#06b6d4" stroke="#070a10" stroke-width="1.5" />
    <circle cx="80" cy="0" r="4" fill="#10b981" stroke="#070a10" stroke-width="1.5" />
  </g>

  <!-- ======================================================== -->
  <!-- NÓ 3: WORKER 02 (APENAS O NÓ - UNIFIED EMERALD)           -->
  <!-- ======================================================== -->
  <g class="svg-node" transform="translate(1150, 375)">
    <!-- Outer Orbital Ring -->
    <circle r="80" fill="url(#node-chassis-grad)" stroke="#10b981" stroke-width="2" filter="url(#glow-emerald)" />
    <circle r="70" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" stroke-dasharray="5 4" />

    <!-- Central Glowing Core -->
    <circle r="46" fill="url(#core-worker-grad)" stroke="#10b981" stroke-width="2" />
    
    <!-- Shard Database Icon -->
    <rect x="-12" y="-18" width="24" height="8" rx="2" fill="#ffffff" />
    <rect x="-12" y="-8" width="24" height="8" rx="2" fill="#a7f3d0" />
    <rect x="-12" y="2" width="24" height="8" rx="2" fill="#ffffff" />
    
    <!-- Core Title -->
    <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="800">WORKER 02</text>
    <text x="0" y="32" text-anchor="middle" fill="#a7f3d0" class="font-mono" font-size="8.5" font-weight="700">[4096..8191]</text>

    <!-- Header Badge -->
    <g transform="translate(0, -98)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.2" />
      <circle cx="-57" cy="0" r="3.5" fill="#10b981" filter="url(#glow-emerald)" />
      <text x="-47" y="3.5" fill="#6ee7b7" class="font-mono" font-size="9" font-weight="700">Worker Shard</text>
    </g>

    <!-- Subtitle below -->
    <text x="0" y="98" text-anchor="middle" fill="#94a3b8" font-size="9.5">LSM Storage Host</text>
    <text x="0" y="111" text-anchor="middle" fill="#64748b" class="font-mono" font-size="8.5">QUIC IO • SWIM :7948</text>

    <!-- Ports -->
    <circle cx="-80" cy="0" r="4.5" fill="#34d399" stroke="#070a10" stroke-width="1.5" />
    <circle cx="-80" cy="-17" r="4" fill="#06b6d4" stroke="#070a10" stroke-width="1.5" />
    <circle cx="80" cy="0" r="4" fill="#10b981" stroke="#070a10" stroke-width="1.5" />
  </g>

</svg>
