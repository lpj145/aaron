<svg viewBox="0 0 1240 480" class="w-full h-auto overflow-visible" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes flowLine {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: flowLine 1.4s linear infinite;
      }
      .svg-node {
        transition: transform 0.25s ease, filter 0.25s ease;
        cursor: pointer;
      }
      .svg-node:hover {
        filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.65));
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
    </style>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-brand" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Chassis Gradients -->
    <radialGradient id="node-chassis-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141f36" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#0b1120" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#060911" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="core-cp-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>

    <radialGradient id="core-worker-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- Conduit Gradients -->
    <linearGradient id="grad-cp-rpc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="grad-swim-gossip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#070a10" rx="16" />

  <!-- Top Category Headers -->
  <g opacity="0.92">
    <text x="300" y="32" text-anchor="middle" fill="#818cf8" class="font-mono" font-size="11.5" font-weight="700" letter-spacing="1.5">CONTROL-PLANE COORDINATOR</text>
    <text x="640" y="32" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="11.5" font-weight="700" letter-spacing="1.5">CLUSTER INTERCONNECT &amp; GOSSIP</text>
    <text x="980" y="32" text-anchor="middle" fill="#34d399" class="font-mono" font-size="11.5" font-weight="700" letter-spacing="1.5">AUTONOMOUS WORKER NODES</text>
  </g>

  <!-- ======================================================== -->
  <!-- CLUSTER CONDUITS (RPC & GOSSIP MESH)                     -->
  <!-- ======================================================== -->

  <!-- 1. Control-Plane -> Worker 01 RPC Conduit -->
  <path id="path-cp-w1" d="M 390 220 C 560 220, 740 145, 895 145" fill="none" stroke="url(#grad-cp-rpc)" stroke-width="2.4" opacity="0.88" />

  <!-- 2. Control-Plane -> Worker 02 RPC Conduit -->
  <path id="path-cp-w2" d="M 390 280 C 560 280, 740 355, 895 355" fill="none" stroke="url(#grad-cp-rpc)" stroke-width="2.4" opacity="0.88" />

  <!-- 3. SWIM Gossip Mesh Conduits (P2P Triangle) -->
  <path id="path-swim-cp-w1" d="M 390 238 C 560 238, 740 163, 895 163" fill="none" stroke="url(#grad-swim-gossip)" stroke-width="2" stroke-dasharray="6 4" class="flow-line" opacity="0.85" />
  <path id="path-swim-cp-w2" d="M 390 262 C 560 262, 740 337, 895 337" fill="none" stroke="url(#grad-swim-gossip)" stroke-width="2" stroke-dasharray="6 4" class="flow-line" opacity="0.85" />
  <path id="path-worker-sync" d="M 1065 145 C 1140 145, 1140 355, 1065 355" fill="none" stroke="#10b981" stroke-width="2.2" stroke-dasharray="5 3" class="flow-line" opacity="0.85" />

  <!-- ======================================================== -->
  <!-- ANIMATED TRAFFIC PARTICLES                               -->
  <!-- ======================================================== -->
  <!-- CP to Worker 1 RPC Particle -->
  <circle r="4" fill="#818cf8" filter="url(#glow-brand)">
    <animateMotion dur="1.8s" repeatCount="indefinite">
      <mpath href="#path-cp-w1"/>
    </animateMotion>
  </circle>

  <!-- CP to Worker 2 RPC Particle -->
  <circle r="4" fill="#818cf8" filter="url(#glow-brand)">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite">
      <mpath href="#path-cp-w2"/>
    </animateMotion>
  </circle>

  <!-- SWIM Gossip Particles -->
  <circle r="3.5" fill="#34d399" filter="url(#glow-emerald)">
    <animateMotion dur="2.2s" repeatCount="indefinite">
      <mpath href="#path-swim-cp-w1"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#34d399" filter="url(#glow-emerald)">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite">
      <mpath href="#path-swim-cp-w2"/>
    </animateMotion>
  </circle>

  <!-- Peer Sync Particle -->
  <circle r="3.5" fill="#10b981" filter="url(#glow-emerald)">
    <animateMotion dur="2.0s" repeatCount="indefinite">
      <mpath href="#path-worker-sync"/>
    </animateMotion>
  </circle>

  <!-- ======================================================== -->
  <!-- CONDUIT FLOATING BADGES                                  -->
  <!-- ======================================================== -->
  <!-- Shard RPC Command Badge (Upper) -->
  <g transform="translate(645, 150)">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#090d16" stroke="#818cf8" stroke-width="1.2" filter="url(#glow-brand)" />
    <circle cx="-80" cy="0" r="3.5" fill="#818cf8" />
    <text x="-70" y="4" fill="#c7d2fe" class="font-mono" font-size="8.8" font-weight="700">Shard Command RPC • :18946</text>
  </g>

  <!-- SWIM Gossip Mesh Badge (Center) -->
  <g transform="translate(645, 250)">
    <rect x="-105" y="-13" width="210" height="26" rx="13" fill="#090d16" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="-90" cy="0" r="3.5" fill="#06b6d4" />
    <text x="-80" y="4.5" fill="#67e8f9" class="font-mono" font-size="9.2" font-weight="700">SWIM Gossip Mesh • :7946</text>
  </g>

  <!-- Shard RPC Command Badge (Lower) -->
  <g transform="translate(645, 350)">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#090d16" stroke="#818cf8" stroke-width="1.2" filter="url(#glow-brand)" />
    <circle cx="-80" cy="0" r="3.5" fill="#818cf8" />
    <text x="-70" y="4" fill="#c7d2fe" class="font-mono" font-size="8.8" font-weight="700">Shard Command RPC • :18946</text>
  </g>

  <!-- Inter-Worker Sync Pill (Right) -->
  <g transform="translate(1145, 250)">
    <rect x="-32" y="-11" width="64" height="22" rx="11" fill="#090d16" stroke="#10b981" stroke-width="1.2" />
    <text x="0" y="4" text-anchor="middle" fill="#34d399" class="font-mono" font-size="8" font-weight="700">P2P SYNC</text>
  </g>

  <!-- ======================================================== -->
  <!-- NÓ 1: CONTROL-PLANE COORDINATOR (APENAS O NÓ)             -->
  <!-- ======================================================== -->
  <g class="svg-node" transform="translate(300, 250)">
    <!-- Outer Orbital Ring -->
    <circle r="90" fill="url(#node-chassis-grad)" stroke="#818cf8" stroke-width="2.2" filter="url(#glow-brand)" />
    <circle r="80" fill="none" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.4" stroke-dasharray="6 5" />

    <!-- Central Core -->
    <circle r="52" fill="url(#core-cp-grad)" stroke="#818cf8" stroke-width="2.2" />
    
    <!-- Crown / Coordinator Icon -->
    <polygon points="0,-22 9,-10 18,-18 12,2 -12,2 -18,-18 -9,-10" fill="#ffffff" />
    
    <!-- Core Title -->
    <text x="0" y="16" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="0.5">CONTROL-PLANE</text>
    <text x="0" y="28" text-anchor="middle" fill="#a5b4fc" class="font-mono" font-size="8.5" font-weight="700">LEADER ACTIVE</text>

    <!-- Subtitle below -->
    <text x="0" y="106" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="11" font-weight="700">orders-coordinator</text>
    <text x="0" y="122" text-anchor="middle" fill="#94a3b8" font-size="9">State Consensus • Topology Director</text>
    <text x="0" y="135" text-anchor="middle" fill="#64748b" class="font-mono" font-size="8.5">RPC :18946 • SWIM :7946</text>

    <!-- Outbound Ports -->
    <circle cx="90" cy="-30" r="4.5" fill="#818cf8" stroke="#070a10" stroke-width="1.5" />
    <circle cx="90" cy="30" r="4.5" fill="#818cf8" stroke="#070a10" stroke-width="1.5" />
    <circle cx="90" cy="-12" r="4" fill="#06b6d4" stroke="#070a10" stroke-width="1.5" />
    <circle cx="90" cy="12" r="4" fill="#06b6d4" stroke="#070a10" stroke-width="1.5" />
  </g>

  <!-- ======================================================== -->
  <!-- NÓ 2: WORKER 01 (APENAS O NÓ)                             -->
  <!-- ======================================================== -->
  <g class="svg-node" transform="translate(980, 145)">
    <!-- Outer Orbital Ring -->
    <circle r="85" fill="url(#node-chassis-grad)" stroke="#10b981" stroke-width="2.2" filter="url(#glow-emerald)" />
    <circle r="75" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" stroke-dasharray="5 4" />

    <!-- Central Core -->
    <circle r="50" fill="url(#core-worker-grad)" stroke="#10b981" stroke-width="2" />
    
    <!-- Shard Database Stack Icon -->
    <rect x="-12" y="-18" width="24" height="8" rx="2" fill="#ffffff" />
    <rect x="-12" y="-8" width="24" height="8" rx="2" fill="#a7f3d0" />
    <rect x="-12" y="2" width="24" height="8" rx="2" fill="#ffffff" />
    
    <!-- Core Title -->
    <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">WORKER 01</text>
    <text x="0" y="33" text-anchor="middle" fill="#a7f3d0" class="font-mono" font-size="8.5" font-weight="700">[0000..4095]</text>

    <!-- Subtitle below -->
    <text x="0" y="104" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="10.5" font-weight="700">worker-shard-01</text>
    <text x="0" y="118" text-anchor="middle" fill="#94a3b8" font-size="8.5">LSM Storage Engine • SWIM :7947</text>

    <!-- Ports -->
    <circle cx="-85" cy="0" r="4.5" fill="#818cf8" stroke="#070a10" stroke-width="1.5" />
    <circle cx="-85" cy="18" r="4" fill="#06b6d4" stroke="#070a10" stroke-width="1.5" />
    <circle cx="85" cy="0" r="4.5" fill="#10b981" stroke="#070a10" stroke-width="1.5" />
  </g>

  <!-- ======================================================== -->
  <!-- NÓ 3: WORKER 02 (APENAS O NÓ - UNIFIED EMERALD)           -->
  <!-- ======================================================== -->
  <g class="svg-node" transform="translate(980, 355)">
    <!-- Outer Orbital Ring -->
    <circle r="85" fill="url(#node-chassis-grad)" stroke="#10b981" stroke-width="2.2" filter="url(#glow-emerald)" />
    <circle r="75" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" stroke-dasharray="5 4" />

    <!-- Central Core -->
    <circle r="50" fill="url(#core-worker-grad)" stroke="#10b981" stroke-width="2" />
    
    <!-- Shard Database Stack Icon -->
    <rect x="-12" y="-18" width="24" height="8" rx="2" fill="#ffffff" />
    <rect x="-12" y="-8" width="24" height="8" rx="2" fill="#a7f3d0" />
    <rect x="-12" y="2" width="24" height="8" rx="2" fill="#ffffff" />
    
    <!-- Core Title -->
    <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">WORKER 02</text>
    <text x="0" y="33" text-anchor="middle" fill="#a7f3d0" class="font-mono" font-size="8.5" font-weight="700">[4096..8191]</text>

    <!-- Subtitle below -->
    <text x="0" y="104" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="10.5" font-weight="700">worker-shard-02</text>
    <text x="0" y="118" text-anchor="middle" fill="#94a3b8" font-size="8.5">LSM Storage Engine • SWIM :7948</text>

    <!-- Ports -->
    <circle cx="-85" cy="0" r="4.5" fill="#818cf8" stroke="#070a10" stroke-width="1.5" />
    <circle cx="-85" cy="-18" r="4" fill="#06b6d4" stroke="#070a10" stroke-width="1.5" />
    <circle cx="85" cy="0" r="4.5" fill="#10b981" stroke="#070a10" stroke-width="1.5" />
  </g>

</svg>
