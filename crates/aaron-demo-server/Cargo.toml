[package]
name = "aaron-demo-server"
description = "Landing page and multi-cluster interactive live sandbox orchestrator for Aaron"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "json", "matched-path", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1.10", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }

aaron = { path = "../aaron", features = ["full"] }
