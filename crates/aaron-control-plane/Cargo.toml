[package]
name = "aaron-control-plane"
description = "Raft distributed consensus and metadata state machine for Aaron"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aaron-core = { version = "0.1.0", path = "../aaron-core" }
aaron-membership = { version = "0.1.0", path = "../aaron-membership" }
openraft = { version = "0.9", features = ["single-term-leader", "tracing-log"] }
tokio.workspace = true
tracing.workspace = true
tokio-util.workspace = true
snafu.workspace = true
planus = "1.3.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
bytes = "1.10"

[build-dependencies]
aaron-build = { version = "0.1.0", path = "../aaron-build" }

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true
