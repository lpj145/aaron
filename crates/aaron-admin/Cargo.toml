[package]
name = "aaron-admin"
description = "Embedded Vue.js administration dashboard and cluster monitoring API for Aaron"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
snafu.workspace = true
aaron-core = { version = "0.1.0", path = "../aaron-core" }
aaron-membership = { version = "0.1.0", path = "../aaron-membership" }
aaron-tracing = { version = "0.1.0", path = "../aaron-tracing" }
aaron-control-plane = { version = "0.1.0", path = "../aaron-control-plane" }
aaron-shard = { version = "0.1.0", path = "../aaron-shard" }
openraft = { version = "0.9", features = ["single-term-leader", "tracing-log"] }

axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "json", "matched-path", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-embed = { version = "8.5", features = ["include-exclude"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
