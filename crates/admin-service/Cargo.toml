[package]
name = "admin-service"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
snafu.workspace = true
node = { path = "../node" }
membership-service = { path = "../membership-service" }
tracing-service = { path = "../tracing-service" }
control-plane-service = { path = "../control-plane-service" }
shard-service = { path = "../shard-service" }
openraft = { version = "0.9", features = ["single-term-leader", "tracing-log"] }

axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "json", "matched-path", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-embed = { version = "8.5", features = ["include-exclude"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
