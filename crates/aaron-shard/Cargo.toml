[package]
name = "aaron-shard"
description = "Distributed sharding, partition routing, and rebalancing engine for Aaron"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aaron-core = { version = "0.1.0", path = "../aaron-core" }
aaron-control-plane = { version = "0.1.0", path = "../aaron-control-plane" }
aaron-membership = { version = "0.1.0", path = "../aaron-membership" }
tokio.workspace = true
tracing.workspace = true
tokio-util.workspace = true
snafu.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
planus = "1.3.0"

[build-dependencies]
aaron-build = { version = "0.1.0", path = "../aaron-build" }

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true
criterion = "0.8"
twox-hash = "2.1"

[[bench]]
name = "route_bench"
harness = false
