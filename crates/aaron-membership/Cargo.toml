[package]
name = "aaron-membership"
description = "SWIM gossip-based cluster membership protocol with QUIC and FlatBuffers for Aaron"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aaron-core = { version = "0.1.0", path = "../aaron-core" }
aaron-tracing = { version = "0.1.0", path = "../aaron-tracing" }
tokio.workspace = true
tracing.workspace = true
tokio-util.workspace = true
snafu.workspace = true
planus = "1.3.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }

[build-dependencies]
aaron-build = { version = "0.1.0", path = "../aaron-build" }

[dev-dependencies]
tempfile = "3"
